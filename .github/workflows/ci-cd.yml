name: EliteCart CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elitecart-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & run tests
        run: mvn -B clean verify

      - name: Package jar
        run: mvn -B package -DskipTests

      - name: Upload backend jar
        uses: actions/upload-artifact@v4
        with:
          name: elitecart-backend-jar
          path: elitecart-backend/target/elitecart-backend.jar

  frontend:
    name: Frontend — Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elitecart-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: elitecart-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'http://localhost:8080/api' }}

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: elitecart-frontend-dist
          path: elitecart-frontend/dist

  docker-images:
    name: Build Docker Images
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./elitecart-backend
          push: false
          tags: elitecart-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./elitecart-frontend
          push: false
          tags: elitecart-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deployment is intentionally left as a manual/managed step — Railway and
  # Render both auto-deploy on push once connected to this repo (see
  # docs/DEPLOYMENT.md). If you'd rather deploy from Actions directly, add a
  # `deploy` job here using the `railwayapp/cli` action or Render's deploy
  # hook URL, guarded by `if: github.ref == 'refs/heads/main'`.
